<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Hexcrawl Map</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="light">
    <div class="theme-bar">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
        🌙 Dark mode
      </button>
    </div>

    <div class="page">
      <div class="frame">
        <div class="map-layer" aria-label="Map background"></div>
        <svg id="hex-outline-layer" aria-hidden="true"></svg>
        <div id="hex-grid" aria-label="Hex map buttons"></div>
      </div>

      <aside class="color-panel" aria-label="Hex editor panel">
        <div class="selected-hex-row">
          <strong id="selected-hex-label">A1</strong>
        </div>

        <input id="hex-color-input" type="text" value="#808080" placeholder="#RRGGBB or rgba(...)" />

        <div class="textareas-row">
          <textarea
            id="hex-text-input"
            class="hex-textarea"
            placeholder="Paste multiline text here"
          ></textarea>

          <textarea
            id="hex-text-input-2"
            class="hex-textarea"
            placeholder="Second multiline text"
          ></textarea>
        </div>

        <div class="mana-editor">
          <div class="mana-checkboxes" aria-label="Mana icon checkboxes">
            <label class="mana-option">
              <input class="mana-checkbox-input" type="checkbox" data-mana-index="0" />
              <span class="mana-icon-option"></span>
            </label>
            <label class="mana-option">
              <input class="mana-checkbox-input" type="checkbox" data-mana-index="1" />
              <span class="mana-icon-option"></span>
            </label>
            <label class="mana-option">
              <input class="mana-checkbox-input" type="checkbox" data-mana-index="2" />
              <span class="mana-icon-option"></span>
            </label>
            <label class="mana-option">
              <input class="mana-checkbox-input" type="checkbox" data-mana-index="3" />
              <span class="mana-icon-option"></span>
            </label>
            <label class="mana-option">
              <input class="mana-checkbox-input" type="checkbox" data-mana-index="4" />
              <span class="mana-icon-option"></span>
            </label>
            <label class="mana-option stash-option">
              <input class="mana-checkbox-input" type="checkbox" data-mana-index="5" />
              <span class="stash-label">Stash</span>
            </label>
          </div>
        </div>
      </aside>
    </div>

    <script src="script.js"></script>
  </body>
</html>
